name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck

      # Without TYPESAFE_API_KEY the suite uses the scripted provider, so CI stays
      # deterministic and needs no model credentials.
      - name: Run tests (scripted provider)
        run: npm test

      - name: Run tests (live Jev)
        if: ${{ secrets.TYPESAFE_API_KEY != '' }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
